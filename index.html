<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Green Budget – Monthly Budget &amp; Bill Tracker</title>
<meta name="description" content="Set a monthly budget, add categories like groceries and bills, and track every expense. A free, private budget tracker that works great on any phone.">
<meta name="theme-color" content="#0f3d2e">
<meta name="color-scheme" content="light">
<meta name="robots" content="index,follow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Green Budget">
<meta property="og:title" content="Green Budget – Monthly Budget &amp; Bill Tracker">
<meta property="og:description" content="Set a monthly budget, add categories and track every expense. Private, free and made for phones.">
<meta property="og:url" content="https://aunt-budget.vercel.app/">
<style>
:root{
  --bg1:#0f3d2e;--bg2:#1f6f4a;--bg3:#8fd18a;
  --leaf:#2e9e5b;--leaf-d:#17703c;--cream:#f4fbe9;
  --ink:#10321f;--soft:#4f6f5a;--warn:#b8530f;--bad:#c93d3d;--good:#1f7a45;
  --glass:rgba(255,255,255,.9);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;max-width:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;line-height:1.4;
  background:#1f6f4a linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  overflow-wrap:break-word;
}
@supports (overflow:clip){html,body{overflow-x:clip}}
body.noscroll{overflow:hidden}
img,svg{max-width:100%}
:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}

/* ---------- background (decorative, never affects layout) ---------- */
.bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;transition:transform .25s ease-out}
.b1{width:420px;height:420px;background:#a8e6a1;top:-120px;left:-100px}
.b2{width:360px;height:360px;background:#3fbf7f;bottom:-120px;right:-80px}
.b3{width:260px;height:260px;background:#d7f5b1;top:40%;left:55%}
.leaf{position:absolute;top:-60px;font-size:28px;opacity:.85;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) rotate3d(1,1,0,0deg) rotateZ(0)}
  50%{transform:translate3d(40px,50vh,0) rotate3d(1,1,0,180deg) rotateZ(120deg)}
  100%{transform:translate3d(-30px,110vh,0) rotate3d(1,1,0,360deg) rotateZ(260deg)}
}

/* ---------- layout ---------- */
.wrap{
  position:relative;z-index:1;width:100%;max-width:980px;margin:0 auto;
  padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  perspective:1400px;
}
header{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:4px 0 14px;color:var(--cream)}
header h1{
  margin:0;flex:1 1 auto;min-width:0;font-size:clamp(24px,7vw,40px);letter-spacing:.5px;line-height:1.1;
  text-shadow:0 1px 0 #1b6b3d,0 2px 0 #1b6b3d,0 3px 0 #155a33,0 4px 0 #155a33,0 8px 14px rgba(0,0,0,.35)
}
header .logo{font-size:clamp(34px,10vw,44px);display:inline-block;animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotateZ(-8deg) rotateY(-20deg)}50%{transform:rotateZ(8deg) rotateY(20deg)}}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:100%}
.tools .monthin{width:auto;flex:1 1 150px;min-width:0;max-width:100%}

/* ---------- cards ---------- */
.card{
  background:var(--glass);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:16px;margin:14px 0;
  box-shadow:0 1px 0 #fff inset,0 10px 0 -5px rgba(27,107,61,.35),0 18px 30px rgba(0,0,0,.25);
  transition:transform .15s ease-out,box-shadow .3s;min-width:0;
}
@media (hover:hover) and (pointer:fine){
  .card{background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .card:hover{box-shadow:0 1px 0 #fff inset,0 14px 0 -5px rgba(27,107,61,.4),0 30px 46px rgba(0,0,0,.32)}
}
.intro .card{animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(24px) rotateX(14deg)}to{opacity:1}}
h2{margin:0 0 10px;font-size:18px}

/* ---------- inputs & buttons ---------- */
button,.btn,.icon,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select{
  font:inherit;font-size:16px;padding:10px 12px;margin:3px 0;border-radius:12px;min-height:46px;
  border:2px solid #b9d9b2;background:#fff;color:var(--ink);width:100%;min-width:0;outline:none;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.08);transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus{border-color:var(--leaf);box-shadow:inset 0 3px 6px rgba(0,0,0,.08),0 0 0 4px rgba(46,158,91,.25)}
input.bad{border-color:var(--bad)!important;box-shadow:0 0 0 4px rgba(201,61,61,.22)!important;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lbl{display:block;font-weight:700;font-size:14px;margin:8px 0 0}
.btn{
  font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;margin:3px 0;min-height:46px;
  color:#fff;background:linear-gradient(180deg,#1f8f50,var(--leaf-d));
  box-shadow:0 5px 0 #0f4a28,0 10px 16px rgba(0,0,0,.25);
  transition:transform .1s,box-shadow .1s,filter .2s;max-width:100%;
}
@media (hover:hover){.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0f4a28,0 3px 6px rgba(0,0,0,.3)}
.btn.sec{background:linear-gradient(180deg,#fff,#e2f3dc);color:#12552f;box-shadow:0 5px 0 #a9cfa1,0 10px 16px rgba(0,0,0,.18)}
.btn.sec:active{box-shadow:0 1px 0 #a9cfa1}
.btn.warn{background:linear-gradient(180deg,#d9691f,var(--warn));box-shadow:0 5px 0 #7c3607,0 10px 16px rgba(0,0,0,.25)}
.btn.warn:active{box-shadow:0 1px 0 #7c3607}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:12px;min-height:42px;box-shadow:0 4px 0 #0f4a28,0 8px 12px rgba(0,0,0,.2)}
.btn.sm.sec{box-shadow:0 4px 0 #a9cfa1,0 8px 12px rgba(0,0,0,.15)}
.btn.sm.warn{box-shadow:0 4px 0 #7c3607,0 8px 12px rgba(0,0,0,.2)}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 #0f4a28}
.btn.sm.sec:active{box-shadow:0 1px 0 #a9cfa1}
.icon{
  background:none;border:0;cursor:pointer;font-size:18px;min-width:42px;min-height:42px;padding:4px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .2s;flex:none;
}
@media (hover:hover){.icon:hover{transform:scale(1.25) rotate(10deg);background:rgba(0,0,0,.06)}}
.icon:active{background:rgba(0,0,0,.1)}

/* ---------- hero: plant + totals ---------- */
.hero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:center}
.plantbox{width:min(200px,100%);height:230px;perspective:600px;display:grid;place-items:center}
.plant{width:170px;height:210px;transform-style:preserve-3d;animation:spin 14s linear infinite}
@keyframes spin{0%{transform:rotateY(-25deg)}50%{transform:rotateY(25deg)}100%{transform:rotateY(-25deg)}}
.plant .lf{transform-origin:85px 140px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.msg{font-weight:700;margin:0 0 8px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.tot>div{
  background:linear-gradient(160deg,#fff,#e6f6df);border-radius:14px;padding:10px 6px;text-align:center;min-width:0;
  box-shadow:0 4px 0 #b9dcb1,0 8px 14px rgba(0,0,0,.14);
}
.tot small{display:block;color:var(--soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.tot b{display:block;font-size:clamp(15px,4.4vw,19px);overflow-wrap:anywhere;line-height:1.2}
.bar{height:16px;border-radius:99px;background:#d9ecd3;margin-top:12px;overflow:hidden;box-shadow:inset 0 3px 5px rgba(0,0,0,.18)}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#8fd18a,var(--leaf));transition:width .8s cubic-bezier(.3,1.3,.5,1);
  box-shadow:0 0 12px rgba(46,158,91,.6)}
.bar.over i{background:linear-gradient(90deg,#f19a63,var(--bad))}
.neg{color:var(--bad)}

/* ---------- categories, expenses, bills ---------- */
.cathead{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.cathead .name{font-size:18px;font-weight:800;flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.cathead .sp{margin-left:auto;display:flex;flex:none}
.catnums{font-size:14px;color:var(--soft);margin:4px 0;overflow-wrap:anywhere}
.exp{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:6px 6px 6px 12px;margin-top:6px;border-radius:12px;background:#f1faeb;box-shadow:0 3px 0 #cfe6c8}
.exp .what{flex:1 1 130px;min-width:0;overflow-wrap:anywhere}
.exp .what small{display:block;color:var(--soft);margin-top:1px}
.exp .amt{font-weight:800;flex:none;max-width:100%;overflow-wrap:anywhere;text-align:right}
.exp .ctl{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:2px;flex:none;max-width:100%}
.exp .btn.sm{margin:0}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#dfeedb;color:#2d4f3a;white-space:nowrap}
.badge.over{background:var(--bad);color:#fff}
.badge.near{background:var(--warn);color:#fff}
.badge.ok{background:var(--good);color:#fff}
.more{margin:8px 0 0;color:var(--soft);font-size:13px}
.addexp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px;margin-top:10px}
.addbtns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.addbtns .btn{flex:1 1 120px;margin:3px 0}
.chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;color:#fff;background:var(--good);white-space:nowrap}
.chip.over{background:var(--bad)}.chip.near{background:var(--warn)}
.empty{text-align:center;color:var(--soft);padding:20px}
.empty .big{font-size:56px;display:block;animation:sway 3s ease-in-out infinite}

/* ---------- notices ---------- */
.note{background:#fff3c9;border-radius:14px;padding:10px 12px;margin:10px 0;box-shadow:0 4px 0 #ecd98a;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.note.err{background:#ffe0dc;box-shadow:0 4px 0 #e8aaa3}
.note .btn{margin:0}

/* ---------- footer ---------- */
.foot{margin:26px 0 0;padding:12px 14px 14px;border-radius:18px;background:rgba(10,45,32,.85);color:var(--cream);text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px}
.foot a,.linkbtn{
  color:#d7f5b1;font:inherit;font-weight:700;background:none;border:0;padding:8px 12px;min-height:44px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;border-radius:10px;display:inline-flex;align-items:center
}
.foot p{margin:4px 0 0;font-size:13px;opacity:.9}

/* ---------- modal & toast ---------- */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,40,25,.65);overflow:auto;perspective:900px}
.modal.on{display:flex}
.dialog{background:var(--cream);border-radius:22px;padding:20px;width:100%;max-width:420px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;
  box-shadow:0 30px 60px rgba(0,0,0,.5);animation:flip .45s both;outline:none}
@keyframes flip{from{opacity:0;transform:rotateX(-60deg) translateY(30px)}to{opacity:1}}
.dialog h3{margin:0 0 8px;font-size:20px}
.dialog p{margin:6px 0}
.dialog ol,.dialog ul{padding-left:20px;margin:8px 0}
.dialog li{margin:4px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .btn{flex:1 1 120px;margin:3px 0}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,160%);width:max-content;max-width:calc(100vw - 28px);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;text-align:center;
  background:#0f3d2e;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;pointer-events:none;visibility:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.4);transition:transform .4s cubic-bezier(.3,1.4,.5,1),visibility .4s;
}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast.act.on{pointer-events:auto}
.toast button{font:inherit;font-weight:800;color:#fff;background:rgba(255,255,255,.22);border:0;border-radius:10px;padding:8px 16px;min-height:42px;cursor:pointer;text-decoration:underline}
.toast button[hidden]{display:none}
.toast #toastMsg{min-width:0;max-width:100%;overflow-wrap:anywhere}
.toast.success{background:#14683a}
.toast.error{background:#a82a2a}
.toast.info{background:#7a4a0b}

/* ---------- phones ---------- */
@media(max-width:600px){
  .hero{grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px}
  .hero>div:last-child{width:100%}
  .card{padding:14px;border-radius:18px}
}
@media(max-width:480px){
  .tools{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tools .monthin{grid-column:1/-1;width:100%}
  .tools .btn{padding:6px 4px;font-size:13px;line-height:1.15}
  .row2{grid-template-columns:minmax(0,1fr)}
  .actions .btn{flex-basis:100%}
}
@media(max-width:360px){
  .card{padding:12px}
  .cathead .name{font-size:16px}
  .dialog{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="intro">

<noscript><div style="position:relative;z-index:2;background:#fff3c9;color:#10321f;padding:14px;text-align:center;font-family:sans-serif">Green Budget needs JavaScript. Please turn it on in your browser settings and reload this page.</div></noscript>

<div class="bg" id="bg" aria-hidden="true">
  <div class="blob b1" data-d="30"></div><div class="blob b2" data-d="-40"></div><div class="blob b3" data-d="20"></div>
</div>

<div class="wrap" id="top">
  <header>
    <span class="logo" aria-hidden="true">🌿</span>
    <h1>Green Budget</h1>
    <div class="tools">
      <input type="month" id="month" class="monthin" aria-label="Month">
      <button type="button" class="btn sec sm" data-act="excel">⬇ Excel</button>
      <button type="button" class="btn sec sm" data-act="backup">💾 Backup</button>
      <button type="button" class="btn sec sm" data-act="restore">📂 Restore</button>
      <input type="file" id="restoreFile" style="display:none" tabindex="-1" aria-hidden="true">
    </div>
  </header>

  <div id="notices"></div>
  <div id="update"></div>
  <div id="install"></div>
  <div id="banner"></div>

  <main>
    <!-- Hero: plant + totals -->
    <section class="card" data-tilt aria-label="Monthly summary">
      <div class="hero">
        <div class="plantbox">
          <svg class="plant" viewBox="0 0 170 210" id="plant" role="img" aria-label="A plant that grows greener while your budget is healthy">
            <defs>
              <linearGradient id="pot" x1="0" x2="1"><stop offset="0" stop-color="#c9784a"/><stop offset=".5" stop-color="#e49a6a"/><stop offset="1" stop-color="#a85f38"/></linearGradient>
              <radialGradient id="lg" cx=".3" cy=".3"><stop offset="0" stop-color="#8fe28f"/><stop offset="1" stop-color="#2e9e5b"/></radialGradient>

            <path id="stem" d="M85 150 C85 120 85 90 85 60" stroke="#2a7d46" stroke-width="7" fill="none" stroke-linecap="round"/>
            <g id="leaves">
              <path class="lf" data-r="-62" d="M85 140 C40 135 28 105 40 90 C65 90 80 110 85 140Z" fill="url(#lg)"/>
              <path class="lf" data-r="62"  d="M85 140 C130 135 142 105 130 90 C105 90 90 110 85 140Z" fill="url(#lg)"/>
              <path class="lf" data-r="-38" d="M85 110 C50 100 42 70 55 58 C75 62 85 85 85 110Z" fill="url(#lg)"/>
              <path class="lf" data-r="38"  d="M85 110 C120 100 128 70 115 58 C95 62 85 85 85 110Z" fill="url(#lg)"/>
              <path class="lf" data-r="-12" d="M85 85 C60 70 62 40 80 25 C95 42 92 65 85 85Z" fill="url(#lg)"/>
              <path class="lf" data-r="12"  d="M85 85 C110 70 108 40 90 25 C75 42 78 65 85 85Z" fill="url(#lg)"/>
            </g>
            <path d="M45 148 H125 L116 196 H54Z" fill="url(#pot)"/>
            <rect x="40" y="140" width="90" height="14" rx="5" fill="#d98a5a"/>
          </svg>
        </div>
        <div>
          <p class="msg" id="msg">Set your budget to plant your seed 🌱</p>
          <div class="tot">
            <div><small>Budget</small><b id="tB">Rs 0</b></div>
            <div><small>Spent</small><b id="tS">Rs 0</b></div>
            <div><small>Unpaid bills</small><b id="tP">Rs 0</b></div>
            <div><small>Left</small><b id="tL">Rs 0</b></div>
            <div><small>Unplanned</small><b id="tU">Rs 0</b></div>
          </div>
          <div class="bar" id="bar"><i id="barfill"></i></div>
          <div class="row2" style="margin-top:10px">
            <input id="budgetIn" type="number" inputmode="decimal" min="0" step="any" placeholder="Monthly budget (Rs)" aria-label="Monthly budget in rupees">
            <button type="button" class="btn" data-act="budget">Save budget</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Bills to pay -->
    <section class="card" id="billsCard" data-tilt hidden aria-label="Bills to pay">
      <h2>📅 Bills to pay</h2>
      <div id="billsList"></div>
    </section>

    <!-- Add category -->
    <section class="card" data-tilt aria-label="New category">
      <h2>🌱 New category</h2>
      <div class="row2">
        <input id="cn" placeholder="e.g. Groceries" maxlength="40" autocomplete="off" aria-label="Category name">
        <input id="cb" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount for it (Rs)" aria-label="Amount for this category in rupees">
      </div>
      <button type="button" class="btn" data-act="addcat">Add category</button>
    </section>

    <div id="list"></div>
  </main>

  <footer class="foot">
    <nav aria-label="Footer">
      <a href="#top" data-act="top">↑ Back to top</a>
      <button type="button" class="linkbtn" data-act="how">How it works</button>
      <button type="button" class="linkbtn" id="fInstall" data-act="installhelp">Install app</button>
      <button type="button" class="linkbtn" data-act="privacy">Privacy</button>
      <button type="button" class="linkbtn" data-act="backup">Backup</button>
    </nav>
    <p>🌿 Green Budget · Your data stays on this device</p>
  </footer>
</div>

<!-- Modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dtitle"><div class="dialog" id="dialog" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>

<script>
(function () {
"use strict";

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const PREFIX = "greenbudget:";
const MAXAMT = 1e9;
const CUR = "Rs";
const key = m => PREFIX + m;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const round2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const fmt = n => Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 2});
const money = n => (n < 0 ? "-" : "") + CUR + " " + fmt(Math.abs(n));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const mname = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString(undefined, {month: "long", year: "numeric"});
const isoOK = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + "T00:00:00").getTime());
const parseISO = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const fmtDate = s => {
  if (!isoOK(s)) return "";
  const d = parseISO(s), o = {day: "numeric", month: "short"};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
  return d.toLocaleDateString(undefined, o);
};
const daysUntil = s => Math.round((parseISO(s) - parseISO(today())) / 86400000);
function dueInfo(due) {
  const n = daysUntil(due);
  if (n < 0) return {text: "Overdue by " + (-n) + " day" + (n === -1 ? "" : "s"), cls: "over"};
  if (n === 0) return {text: "Due today", cls: "near"};
  if (n <= 3) return {text: "Due in " + n + " day" + (n === 1 ? "" : "s"), cls: "near"};
  return {text: "Due " + fmtDate(due), cls: ""};
}
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const canTilt = window.matchMedia && matchMedia("(hover:hover) and (pointer:fine)").matches && !reduceMotion;
const standalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;

/* ---------------- toast (success / error / info, optional Undo) ---------------- */
let toastTimer;
function toast(msg, type, action) {
  type = type || "info";
  const t = $("toast"), btn = $("toastAct");
  t.className = "toast " + type + (action ? " act" : "");
  $("toastMsg").textContent = (type === "success" ? "✅ " : type === "error" ? "⚠️ " : "ℹ️ ") + msg;
  if (action) {
    btn.hidden = false;
    btn.textContent = action.label;
    btn.onclick = () => {
      t.classList.remove("on");
      try { action.fn(); } catch (e) { console.error(e); toast("That didn't work. Please try again.", "error"); }
    };
  } else { btn.hidden = true; btn.onclick = null; }
  void t.offsetWidth;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), action ? 7000 : Math.max(3400, msg.length * 55));
}
function bad(input, msg) {
  if (input) {
    input.classList.add("bad");
    input.setAttribute("aria-invalid", "true");
    try { input.focus(); } catch (e) {}
  }
  toast(msg, "error");
  return false;
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el && el.classList && el.classList.contains("bad")) { el.classList.remove("bad"); el.removeAttribute("aria-invalid"); }
});
window.addEventListener("error", e => {
  console.error(e.error || e.message);
  toast("Something went wrong. Please refresh the page and try again.", "error");
});

/* ---------------- storage ---------------- */
const storageOK = (function () {
  try { const k = "gb:test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
  catch (e) { return false; }
})();
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function months() {
  try { return Object.keys(localStorage).filter(k => k.indexOf(PREFIX) === 0).map(k => k.slice(PREFIX.length)).filter(m => /^\d{4}-\d{2}$/.test(m)).sort(); }
  catch (e) { return []; }
}
const isPaid = e => e.paid !== false;
// heal / validate a saved month so one bad entry can never break the page (old saves without bill fields still load)
function normalize(d, m) {
  if (!d || typeof d !== "object" || !Array.isArray(d.categories)) return null;
  return {
    id: m,
    budget: Math.max(0, +d.budget || 0),
    categories: d.categories.filter(c => c && typeof c === "object").map(c => ({
      id: String(c.id || uid()),
      name: String(c.name || "Category").slice(0, 40),
      limit: Math.max(0, +c.limit || 0),
      expenses: (Array.isArray(c.expenses) ? c.expenses : []).filter(e => e && isFinite(+e.amount)).map(e => {
        const due = isoOK(String(e.due || "")) ? String(e.due) : "";
        return {
          id: String(e.id || uid()),
          note: String(e.note || "Expense").slice(0, 60),
          amount: +e.amount,
          date: String(e.date || ""),
          due: due,
          paid: due ? e.paid !== false : true,
          paidDate: isoOK(String(e.paidDate || "")) ? String(e.paidDate) : "",
          carried: !!e.carried
        };
      })
    }))
  };
}
function readMonth(m) {
  const raw = lsGet(key(m));
  if (!raw) return null;
  try { return normalize(JSON.parse(raw), m); } catch (e) { return null; }
}

let doc = null;
let curMonth = "";

function load() {
  const m = curMonth;
  doc = readMonth(m);
  if (!doc) {
    // new month: copy last month's budget and categories; unpaid bills carry over so they are never forgotten
    const prev = months().filter(x => x < m).pop();
    const p = prev ? readMonth(prev) : null;
    doc = {
      id: m,
      budget: p ? p.budget : 0,
      categories: p ? p.categories.map(c => ({
        id: uid(), name: c.name, limit: c.limit,
        expenses: c.expenses.filter(e => !isPaid(e)).map(e => ({id: uid(), note: e.note, amount: e.amount, date: e.date, due: e.due, paid: false, paidDate: "", carried: true}))
      })) : []
    };
  }
  $("budgetIn").value = doc.budget || "";
  render(); banner();
}
function save() {
  if (!lsSet(key(doc.id), JSON.stringify(doc))) {
    render();
    toast("Couldn't save. Your browser is blocking storage, so please use a normal (not private) tab, and press Backup before you leave.", "error");
    return false;
  }
  render();
  return true;
}

/* ---------------- maths ---------------- */
const sumAmt = list => round2(list.reduce((s, e) => s + +e.amount, 0));
const catPaid = c => sumAmt(c.expenses.filter(isPaid));
const catUnpaid = c => sumAmt(c.expenses.filter(e => !isPaid(e)));
const catUsed = c => round2(catPaid(c) + catUnpaid(c));
function totals() {
  const spent = round2(doc.categories.reduce((s, c) => s + catPaid(c), 0));
  const unpaid = round2(doc.categories.reduce((s, c) => s + catUnpaid(c), 0));
  const used = round2(spent + unpaid);
  const planned = round2(doc.categories.reduce((s, c) => s + +c.limit, 0));
  return {budget: +doc.budget, spent, unpaid, used, left: round2(doc.budget - used), planned, unplanned: round2(doc.budget - planned)};
}
function parseAmount(s) {
  s = String(s == null ? "" : s).trim().replace(",", ".");
  if (s === "") return null;
  const n = Number(s);
  if (!isFinite(n) || n < 0 || n > MAXAMT) return null;
  return round2(n);
}
const findCat = id => doc.categories.find(c => c.id === id);
const findExp = (c, id) => c && c.expenses.find(e => e.id === id);
const cleanName = s => String(s).trim().replace(/\s+/g, " ").slice(0, 40);

/* ---------------- render ---------------- */
function expRow(c, e) {
  const bill = !!e.due, unpaid = bill && !isPaid(e);
  let sub;
  if (bill) {
    sub = unpaid
      ? '<span class="badge ' + dueInfo(e.due).cls + '">' + esc(dueInfo(e.due).text) + '</span>'
      : '<span class="badge ok">Paid' + (e.paidDate ? " " + esc(fmtDate(e.paidDate)) : "") + '</span>';
    if (e.carried) sub += ' <span class="badge">from last month</span>';
  } else sub = esc(fmtDate(e.date) || e.date);
  const ids = ' data-c="' + c.id + '" data-e="' + e.id + '"';
  return '<div class="exp"><span class="what">' + esc(e.note) + '<small>' + sub + '</small></span>' +
    '<span class="amt">' + money(e.amount) + '</span>' +
    '<span class="ctl">' +
      (unpaid ? '<button type="button" class="btn sm" data-act="togglepaid"' + ids + '>✓ Paid</button>' : '') +
      (bill && !unpaid ? '<button type="button" class="icon" data-act="togglepaid"' + ids + ' aria-label="Mark ' + esc(e.note) + ' as unpaid">↩️</button>' : '') +
      '<button type="button" class="icon" data-act="editexp"' + ids + ' aria-label="Edit ' + esc(e.note) + '">✏️</button>' +
      '<button type="button" class="icon" data-act="delexp"' + ids + ' aria-label="Remove ' + esc(e.note) + '">✕</button>' +
    '</span></div>';
}
function render() {
  const t = totals();
  $("tB").textContent = money(t.budget);
  $("tS").textContent = money(t.spent);
  $("tP").textContent = money(t.unpaid);
  $("tL").textContent = money(t.left);
  $("tL").className = t.left < 0 ? "neg" : "";
  $("tU").textContent = money(t.unplanned);
  $("tU").className = t.unplanned < 0 ? "neg" : "";

  const pctUsed = t.budget > 0 ? Math.min(100, t.used / t.budget * 100) : 0;
  $("barfill").style.width = pctUsed + "%";
  $("bar").classList.toggle("over", t.left < 0);

  const health = t.budget > 0 ? Math.max(0, Math.min(1, t.left / t.budget)) : 0.5;
  paintPlant(health);

  let m = "Set your budget to plant your seed 🌱";
  if (t.budget > 0) {
    if (t.left < 0) m = "Over budget by " + money(-t.left) + ". Edit your budget or trim spending 🥀";
    else if (health < .2) m = "Running low. Your plant needs care 🍂";
    else if (health < .5) m = "Half the budget used. Steady growth 🌿";
    else m = "Lovely and green. Plenty left 🌳";
  }
  $("msg").textContent = m;

  // bills to pay (unpaid bills, soonest first)
  const bills = [];
  doc.categories.forEach(c => c.expenses.forEach(e => { if (e.due && !isPaid(e)) bills.push({c: c, e: e}); }));
  bills.sort((a, b) => a.e.due < b.e.due ? -1 : a.e.due > b.e.due ? 1 : 0);
  $("billsCard").hidden = !bills.length;
  $("billsList").innerHTML = bills.slice(0, 6).map(x => {
    const di = dueInfo(x.e.due);
    return '<div class="exp"><span class="what">' + esc(x.e.note) + '<small>' + esc(x.c.name) + ' · <span class="badge ' + di.cls + '">' + esc(di.text) + '</span></small></span>' +
      '<span class="amt">' + money(x.e.amount) + '</span>' +
      '<span class="ctl"><button type="button" class="btn sm" data-act="togglepaid" data-c="' + x.c.id + '" data-e="' + x.e.id + '">✓ Paid</button></span></div>';
  }).join("") + (bills.length > 6 ? '<p class="more">+ ' + (bills.length - 6) + ' more bills inside their categories</p>' : "");

  const list = $("list"), keep = {};
  list.querySelectorAll("input").forEach(i => { if (i.value) keep[i.id] = i.value; });

  if (!doc.categories.length) {
    list.innerHTML = '<div class="card empty"><span class="big">🪴</span>No categories yet. Add one above, like Groceries or Electricity.</div>';
  } else {
    list.innerHTML = doc.categories.map(c => {
      const paid = catPaid(c), un = catUnpaid(c), used = round2(paid + un), left = round2(c.limit - used);
      const pct = c.limit > 0 ? used / c.limit * 100 : (used > 0 ? 101 : 0);
      const chip = left < 0 ? '<span class="chip over">Over by ' + money(-left) + '</span>'
        : pct >= 80 ? '<span class="chip near">' + money(left) + ' left</span>'
        : '<span class="chip">' + money(left) + ' left</span>';
      return '<section class="card cat" data-tilt>' +
        '<div class="cathead">' +
          '<span class="name">🍃 ' + esc(c.name) + '</span>' + chip +
          '<span class="sp">' +
            '<button type="button" class="icon" data-act="edit" data-c="' + c.id + '" aria-label="Edit ' + esc(c.name) + '">✏️</button>' +
            '<button type="button" class="icon" data-act="delcat" data-c="' + c.id + '" aria-label="Delete ' + esc(c.name) + '">🗑️</button>' +
          '</span>' +
        '</div>' +
        '<div class="catnums">Budget ' + money(c.limit) + ' · Spent ' + money(paid) + (un > 0 ? ' · Unpaid ' + money(un) : '') +
          ' · Left <b class="' + (left < 0 ? "neg" : "") + '">' + money(left) + '</b></div>' +
        '<div class="bar ' + (left < 0 ? "over" : "") + '"><i style="width:' + Math.min(100, pct) + '%"></i></div>' +
        c.expenses.map(e => expRow(c, e)).join("") +
        '<div class="addexp">' +
          '<input id="en-' + c.id + '" placeholder="What for?" maxlength="60" autocomplete="off" aria-label="What for in ' + esc(c.name) + '">' +
          '<input id="ea-' + c.id + '" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount (Rs)" aria-label="Amount in rupees for ' + esc(c.name) + '">' +
          '<div class="addbtns">' +
            '<button type="button" class="btn sm" data-act="addexp" data-c="' + c.id + '">+ Spend</button>' +
            '<button type="button" class="btn sm sec" data-act="bill" data-c="' + c.id + '">📅 Add bill</button>' +
          '</div>' +
        '</div>' +
      '</section>';
    }).join("");
  }
  Object.keys(keep).forEach(id => { const el = $(id); if (el) el.value = keep[id]; });
  bindTilt();
}

function paintPlant(h) {
  document.querySelectorAll("#leaves .lf").forEach(l => {
    const r = +l.dataset.r;
    const droop = (1 - h) * (r < 0 ? -55 : 55);
    const s = 0.45 + 0.55 * h;
    l.style.transform = "rotate(" + droop + "deg) scale(" + s + ")";
    l.setAttribute("fill", h < .25 ? "#b8a04a" : h < .5 ? "#7cbf5b" : "url(#lg)");
  });
  const top = 60 + (1 - h) * 45;
  $("stem").setAttribute("d", "M85 150 C85 120 85 " + ((150 + top) / 2) + " 85 " + top);
}

/* ---------------- notices & install ---------------- */
function notices() {
  let html = "";
  if (!storageOK) {
    html += '<div class="note err" role="alert">⚠️ Your browser is blocking saving (private mode?). Anything you enter will be lost when you close this page. Open the site in a normal tab.</div>';
  }
  if (/FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Messenger|TikTok|Snapchat|; wv\)/i.test(navigator.userAgent)) {
    html += '<div class="note">ℹ️ You are viewing this inside another app. To save your data safely and download files, open this link in Chrome or Samsung Internet.</div>';
  }

}
function banner() {

let deferredPrompt = null;
function showInstall() {

    '<div class="note">📲 Install Green Budget for a home-screen icon and offline use. ' +

}
function dueReminder() {
  let n = 0;
  doc.categories.forEach(c => c.expenses.forEach(e => { if (e.due && !isPaid(e) && daysUntil(e.due) <= 3) n++; }));
  if (n) toast("You have " + n + " bill" + (n > 1 ? "s" : "") + " due soon or overdue 📅", "info");

/* ---------------- modal ---------------- */
let lastFocus = null;
function openModal(html, focusInput) {
  lastFocus = document.activeElement;
  $("dialog").innerHTML = html;
  $("modal").classList.add("on");
  document.body.classList.add("noscroll");
  const i = focusInput ? $("dialog").querySelector("input") : null;
  setTimeout(() => { try { (i || $("dialog")).focus(); if (i && i.select) i.select(); } catch (e) {} }, 60);
}
function closeModal() {
  $("modal").classList.remove("on");
  document.body.classList.remove("noscroll");
  $("dialog").innerHTML = "";
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
}
function wire(okFn) {
  const ok = $("ok"), no = $("no");
  if (ok) ok.onclick = () => { try { okFn(); } catch (err) { console.error(err); toast("That didn't work. Please try again.", "error"); } };
  if (no) no.onclick = closeModal;
}
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function openInfo(title, body) {
  openModal('<h3 id="dtitle">' + title + '</h3>' + body + '<div class="actions"><button type="button" class="btn" id="no">Close</button></div>');
  wire(null);
}

/* ---------------- undo ---------------- */
function undoTo(snapshot, month) {
  const d = normalize(JSON.parse(snapshot), month);
  if (!d) return toast("Couldn't undo that.", "error");
  if (month !== curMonth) { curMonth = month; $("month").value = month; }
  doc = d;
  $("budgetIn").value = doc.budget || "";
  if (save()) toast("Put back ✓", "success");
}
function removedToast(msg, snapshot, month) {
  toast(msg, "success", {label: "Undo", fn: () => undoTo(snapshot, month)});
}

/* ---------------- budget & category actions ---------------- */
function askRaiseBudget(reason, suggested) {
  openModal('<h3 id="dtitle">🥀 Over budget</h3><p>' + esc(reason) + '</p><p>Set a new monthly budget (Rs):</p>' +
    '<input id="m-b" type="number" inputmode="decimal" min="0" step="any" value="' + Math.ceil(suggested) + '" aria-label="New monthly budget in rupees">' +
    '<div class="actions"><button type="button" class="btn" id="ok">Update budget</button><button type="button" class="btn sec" id="no">Leave it</button></div>', true);
  wire(() => {
    const inp = $("m-b"), v = parseAmount(inp.value);
    if (v === null) return bad(inp, "Please enter a valid budget amount.");
    doc.budget = v; $("budgetIn").value = v; closeModal();
    if (save()) toast("Budget updated to " + money(v) + " 🌳", "success");
  });
  $("no").onclick = () => { closeModal(); toast("Okay, your budget stays as it is.", "info"); };
}
function askRaiseCat(c, reason) {
  openModal('<h3 id="dtitle">🍂 Category over budget</h3><p>' + esc(reason) + '</p><p>New amount for “' + esc(c.name) + '” (Rs):</p>' +
    '<input id="m-b" type="number" inputmode="decimal" min="0" step="any" value="' + Math.ceil(catUsed(c)) + '" aria-label="New amount for ' + esc(c.name) + '">' +
    '<div class="actions"><button type="button" class="btn" id="ok">Update</button><button type="button" class="btn sec" id="no">Leave it</button></div>', true);
  wire(() => {
    const inp = $("m-b"), v = parseAmount(inp.value);
    if (v === null) return bad(inp, "Please enter a valid amount.");
    c.limit = v; closeModal();
    if (!save()) return;
    const t = totals();
    if (t.budget > 0 && t.planned > t.budget) {
      askRaiseBudget("Your categories now add up to " + money(t.planned) + ", more than your budget of " + money(t.budget) + ".", t.planned);
    } else toast("“" + c.name + "” updated to " + money(v) + " 🌳", "success");
  });
}
function editCat(cid) {
  const c = findCat(cid);
  if (!c) return toast("That category no longer exists. Please refresh the page.", "error");
  openModal('<h3 id="dtitle">✏️ Edit category</h3>' +
    '<input id="m-n" maxlength="40" value="' + esc(c.name) + '" aria-label="Category name" autocomplete="off">' +
    '<input id="m-b" type="number" inputmode="decimal" min="0" step="any" value="' + c.limit + '" aria-label="Category amount in rupees">' +
    '<div class="actions"><button type="button" class="btn" id="ok">Save</button><button type="button" class="btn sec" id="no">Cancel</button></div>', true);
  wire(() => {
    const ni = $("m-n"), bi = $("m-b"), n = cleanName(ni.value), b = parseAmount(bi.value);
    if (!n) return bad(ni, "Please give the category a name.");
    if (b === null) return bad(bi, "Please enter a valid amount.");
    if (doc.categories.some(x => x.id !== c.id && x.name.toLowerCase() === n.toLowerCase())) return bad(ni, "You already have a category called “" + n + "”.");
    c.name = n; c.limit = b; closeModal();
    if (!save()) return;
    toast("Category updated 🌿", "success");
    const t = totals();
    if (t.budget > 0 && t.planned > t.budget) askRaiseBudget("Your categories now add up to " + money(t.planned) + ", more than your budget of " + money(t.budget) + ".", t.planned);
  });
}
function delCat(cid) {
  const c = findCat(cid);
  if (!c) return toast("That category no longer exists. Please refresh the page.", "error");
  openModal('<h3 id="dtitle">Delete “' + esc(c.name) + '”?</h3><p>Its ' + c.expenses.length + ' item(s) will be removed too.</p>' +
    '<div class="actions"><button type="button" class="btn warn" id="ok">Yes, delete</button><button type="button" class="btn sec" id="no">Keep it</button></div>');
  wire(() => {
    const snap = JSON.stringify(doc), month = doc.id;
    doc.categories = doc.categories.filter(x => x.id !== cid); closeModal();
    if (save()) removedToast("Category deleted", snap, month);
  });
}

/* ---------------- spending, bills, editing ---------------- */
// after any change that adds money to a category: save, then warn / offer to raise the amount if it went over
function settle(c, beforeLeft, beforeCat, okMsg) {
  if (!save()) return false;
  const t = totals(), left = round2(c.limit - catUsed(c));
  if (t.budget > 0 && t.left < 0 && beforeLeft >= 0) {
    askRaiseBudget("Your spending and unpaid bills add up to " + money(t.used) + ", more than your monthly budget of " + money(t.budget) + ".", t.used);
  } else if (left < 0 && beforeCat >= 0) {
    askRaiseCat(c, "“" + c.name + "” is over its amount of " + money(c.limit) + " by " + money(-left) + ".");
  } else if (t.budget <= 0) {
    toast(okMsg + " Set your monthly budget to see what is left.", "success");
  } else if (t.left < 0) {
    toast(okMsg + " You are over your monthly budget by " + money(-t.left) + ".", "info");
  } else {
    toast(okMsg + " " + money(t.left) + " left this month.", "success");
  }
  return true;
}
function addExp(cid) {
  const c = findCat(cid);
  if (!c) return toast("That category no longer exists. Please refresh the page.", "error");
  const ni = $("en-" + cid), ai = $("ea-" + cid);
  const amt = parseAmount(ai.value);
  if (amt === null || amt <= 0) return bad(ai, "Please enter how much you spent (more than 0).");
  const note = (ni.value.trim() || "Expense").slice(0, 60);
  const beforeLeft = totals().left, beforeCat = round2(c.limit - catUsed(c));
  c.expenses.push({id: uid(), note: note, amount: amt, date: today(), due: "", paid: true, paidDate: "", carried: false});
  ni.value = ai.value = "";
  settle(c, beforeLeft, beforeCat, "Added “" + note + "”.");
}
function addBill(cid) {
  const c = findCat(cid);
  if (!c) return toast("That category no longer exists. Please refresh the page.", "error");
  const ni = $("en-" + cid), ai = $("ea-" + cid);
  openModal('<h3 id="dtitle">📅 Add a bill</h3><p>A bill you still have to pay. It counts against your budget now. Tap <b>Paid</b> when you pay it.</p>' +
    '<input id="m-n" maxlength="60" placeholder="Bill name, e.g. Electricity" value="' + esc(ni.value) + '" aria-label="Bill name" autocomplete="off">' +
    '<input id="m-a" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount (Rs)" value="' + esc(ai.value) + '" aria-label="Bill amount in rupees">' +
    '<label class="lbl" for="m-d">Due date</label><input id="m-d" type="date" value="' + today() + '">' +
    '<div class="actions"><button type="button" class="btn" id="ok">Add bill</button><button type="button" class="btn sec" id="no">Cancel</button></div>', true);
  wire(() => {
    const nI = $("m-n"), aI = $("m-a"), dI = $("m-d");
    const amt = parseAmount(aI.value);
    if (amt === null || amt <= 0) return bad(aI, "Please enter the bill amount (more than 0).");
    if (!isoOK(dI.value)) return bad(dI, "Please pick the due date.");
    const note = (nI.value.trim() || "Bill").slice(0, 60);
    const beforeLeft = totals().left, beforeCat = round2(c.limit - catUsed(c));
    c.expenses.push({id: uid(), note: note, amount: amt, date: today(), due: dI.value, paid: false, paidDate: "", carried: false});
    ni.value = ai.value = "";
    closeModal();
    settle(c, beforeLeft, beforeCat, "Bill “" + note + "” added.");
  });
}
function editExp(cid, eid) {
  const c = findCat(cid), e = findExp(c, eid);
  if (!e) return toast("That item no longer exists. Please refresh the page.", "error");
  const bill = !!e.due;
  openModal('<h3 id="dtitle">✏️ Edit ' + (bill ? "bill" : "expense") + '</h3>' +
    '<input id="m-n" maxlength="60" value="' + esc(e.note) + '" aria-label="Name" autocomplete="off">' +
    '<input id="m-a" type="number" inputmode="decimal" min="0" step="any" value="' + e.amount + '" aria-label="Amount in rupees">' +
    '<label class="lbl" for="m-d">' + (bill ? "Due date" : "Date") + '</label><input id="m-d" type="date" value="' + esc(bill ? e.due : e.date) + '">' +
    '<div class="actions"><button type="button" class="btn" id="ok">Save</button><button type="button" class="btn sec" id="no">Cancel</button></div>', true);
  wire(() => {
    const nI = $("m-n"), aI = $("m-a"), dI = $("m-d");
    const amt = parseAmount(aI.value);
    if (amt === null || amt <= 0) return bad(aI, "Please enter an amount (more than 0).");
    if (!isoOK(dI.value)) return bad(dI, "Please pick a valid date.");
    const note = (nI.value.trim() || (bill ? "Bill" : "Expense")).slice(0, 60);
    const beforeLeft = totals().left, beforeCat = round2(c.limit - catUsed(c));
    e.note = note; e.amount = amt;
    if (bill) e.due = dI.value; else e.date = dI.value;
    closeModal();
    settle(c, beforeLeft, beforeCat, "Updated “" + note + "”.");
  });
}
function togglePaid(cid, eid) {
  const c = findCat(cid), e = findExp(c, eid);
  if (!e) return toast("That bill no longer exists. Please refresh the page.", "error");
  if (isPaid(e)) { e.paid = false; e.paidDate = ""; } else { e.paid = true; e.paidDate = today(); }
  if (save()) toast(e.paid ? "“" + e.note + "” marked as paid ✓" : "“" + e.note + "” moved back to unpaid", "success");
}
function delExp(cid, eid) {
  const c = findCat(cid), e = findExp(c, eid);
  if (!e) return toast("That item no longer exists. Please refresh the page.", "error");
  const snap = JSON.stringify(doc), month = doc.id;
  c.expenses = c.expenses.filter(x => x.id !== eid);
  if (save()) removedToast("“" + e.note + "” removed", snap, month);
}

/* ---------------- Excel / CSV ---------------- */
function exportExcel(m) {
  m = m || curMonth;
  const d = m === doc.id ? doc : readMonth(m);
  if (!d) return toast("There is nothing saved for " + mname(m) + " yet.", "error");
  const rows = [["Category", "Category budget (Rs)", "Item", "Amount (Rs)", "Date", "Status", "Due date", "Paid date"]];
  let spent = 0, unpaid = 0, planned = 0;
  d.categories.forEach(c => {
    planned += +c.limit;
    if (!c.expenses.length) rows.push([c.name, +c.limit, "", "", "", "", "", ""]);
    c.expenses.forEach(e => {
      const paid = isPaid(e);
      if (paid) spent += +e.amount; else unpaid += +e.amount;
      rows.push([c.name, +c.limit, e.note, +e.amount, e.date, paid ? "Paid" : "Unpaid", e.due || "", e.paidDate || ""]);
    });
  });
  rows.push([], ["Monthly budget (Rs)", +d.budget], ["Paid so far (Rs)", round2(spent)], ["Unpaid bills (Rs)", round2(unpaid)],
    ["Left (Rs)", round2(d.budget - spent - unpaid)], ["Planned in categories (Rs)", round2(planned)]);
  toast("Preparing your Excel file…", "info");
  loadXlsx().then(() => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{wch: 22}, {wch: 20}, {wch: 24}, {wch: 14}, {wch: 12}, {wch: 10}, {wch: 12}, {wch: 12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, m);
    XLSX.writeFile(wb, "budget-" + m + ".xlsx");
    markExported(m); toast("Excel file downloaded for " + mname(m) + " ⬇", "success");
  }).catch(() => {
    try {
      downloadCsv(rows, m); markExported(m);
      toast("Your connection is weak, so the file was saved as CSV instead. It opens in Excel.", "success");
    } catch (err) {
      console.error(err);
      toast("Couldn't create the file. Please check your connection and try again, or use Backup.", "error");
    }
  });
}
function markExported(m) { lsSet("greenexported:" + m, "1"); banner(); }
function loadXlsx() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res();
    const s = document.createElement("script");
    const t = setTimeout(() => { s.remove(); rej(new Error("timeout")); }, 8000);
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => { clearTimeout(t); window.XLSX ? res() : rej(new Error("missing")); };
    s.onerror = () => { clearTimeout(t); s.remove(); rej(new Error("load")); };
    document.head.appendChild(s);
  });
}
function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function downloadCsv(rows, m) {
  const csv = "﻿" + rows.map(r => r.map(v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  downloadBlob(new Blob([csv], {type: "text/csv;charset=utf-8"}), "budget-" + m + ".csv");
}

/* ---------------- backup & restore ---------------- */
function backupAll() {
  const ms = months();
  if (!ms.length) return toast("Nothing to back up yet. Add a budget or a category first.", "error");
  try {
    const out = {app: "green-budget", version: 2, exportedAt: new Date().toISOString(), months: {}};
    ms.forEach(m => { const d = readMonth(m); if (d) out.months[m] = d; });
    downloadBlob(new Blob([JSON.stringify(out, null, 2)], {type: "application/json"}), "green-budget-backup-" + today() + ".json");
    toast("Backup saved 💾 (" + ms.length + " month" + (ms.length > 1 ? "s" : "") + "). Keep the file somewhere safe.", "success");
  } catch (err) {
    console.error(err);
    toast("Couldn't create the backup. Please try again in Chrome or Samsung Internet.", "error");
  }
}
function pickRestore() { $("restoreFile").value = ""; $("restoreFile").click(); }
$("restoreFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onerror = () => toast("Couldn't read that file. Please pick it again.", "error");
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch (err) { return toast("That file isn't a valid backup. Please choose a green-budget-backup .json file.", "error"); }
    if (!data || data.app !== "green-budget" || !data.months || typeof data.months !== "object")
      return toast("That file isn't a Green Budget backup.", "error");
    const good = {};
    Object.keys(data.months).filter(m => /^\d{4}-\d{2}$/.test(m)).sort().forEach(m => {
      const d = normalize(data.months[m], m);
      if (d) good[m] = d;
    });
    const keys = Object.keys(good);
    if (!keys.length) return toast("No usable months were found in that backup.", "error");
    const spentOf = d => round2(d.categories.reduce((s, c) => s + catUsed(c), 0));
    const items = keys.map(m => '<li><b>' + esc(mname(m)) + '</b>: ' + good[m].categories.length + ' categories, ' + money(spentOf(good[m])) + ' used ' +
      (lsGet(key(m)) ? '<span class="chip near">replaces current</span>' : '<span class="chip">new</span>') + '</li>').join("");
    openModal('<h3 id="dtitle">📂 Restore backup?</h3><p>This backup contains:</p><ul>' + items + '</ul>' +
      '<p>Only these months are changed. Every other month on this phone stays as it is.</p>' +
      '<div class="actions"><button type="button" class="btn" id="ok">Restore</button><button type="button" class="btn sec" id="no">Cancel</button></div>');
    wire(() => {
      let saved = 0;
      keys.forEach(m => { if (lsSet(key(m), JSON.stringify(good[m]))) saved++; });
      closeModal();
      if (saved !== keys.length) return toast("Couldn't restore everything. Your browser is blocking storage.", "error");
      curMonth = keys[keys.length - 1];
      $("month").value = curMonth;
      load();
      toast("Restored " + saved + " month" + (saved > 1 ? "s" : "") + " 🌳 Showing " + mname(curMonth), "success");
    });
  };
  r.readAsText(f);
});

/* ---------------- footer info ---------------- */
const HOW = '<ol><li>Type your monthly budget and tap <b>Save budget</b>.</li>' +
  '<li>Add categories like Groceries or Electricity, each with an amount.</li>' +
  '<li>Inside a category tap <b>+ Spend</b> when you buy something, or <b>📅 Add bill</b> for a bill you still have to pay.</li>' +
  '<li>Bills show in <b>Bills to pay</b> at the top with their due dates. Tap <b>✓ Paid</b> when you pay one.</li>' +
  '<li>Tap ✏️ on an item to fix it. If you remove something by mistake, tap <b>Undo</b> straight away.</li>' +
  '<li>If you go over, the plant wilts and you can change the budget.</li>' +
  '<li>At the end of the month tap <b>Excel</b> or <b>Backup</b> to keep a copy.</li></ol>' +
  '<p>Unpaid bills count against your budget right away, so <b>Left</b> shows what you can still spend after paying them. Bills you have not paid by the end of the month move to the next month.</p>';
const PRIVACY = '<p>Green Budget has no accounts and no server. Everything you type is saved <b>only in this browser on this device</b>, and nothing is sent anywhere.</p>' +
  '<p>Clearing your browser data, using a private tab or getting a new phone removes it, so press <b>Backup</b> regularly. On a new device tap <b>Restore</b> and pick your backup file.</p>';
const INSTALL = '<p>Installing gives you a Green Budget icon on your home screen, and the app keeps working with a weak or no connection.</p>' +
  '<ul><li><b>Chrome (Android):</b> tap the ⋮ menu, then <b>Install app</b> or <b>Add to Home screen</b>.</li>' +
  '<li><b>Samsung Internet:</b> tap the ≡ menu, then <b>Add page to</b>, then <b>Home screen</b>.</li>' +
  '<li><b>iPhone (Safari):</b> tap Share, then <b>Add to Home Screen</b>.</li></ul>' +
  '<p>Use the same browser you normally use for this site, so your saved data comes with you. On iPhone an installed app keeps its own separate data, so use Backup and Restore to move it.</p>';

/* ---------------- button dispatcher ---------------- */
const ACT = {
  top() { window.scrollTo({top: 0, behavior: reduceMotion ? "auto" : "smooth"}); },
  how() { openInfo("🌿 How it works", HOW); },
  privacy() { openInfo("🔒 Your privacy", PRIVACY); },
  reload() { location.reload(); },
  install() {
    if (!deferredPrompt) return ACT.installhelp();
    const p = deferredPrompt; deferredPrompt = null; $("install").innerHTML = "";
    p.prompt();
    if (p.userChoice && p.userChoice.then) p.userChoice.then(r => { if (r && r.outcome !== "accepted") toast("No problem. You can install it later from “Install app” in the footer.", "info"); });
  },
  installno() { lsSet("gb-no-install", "1"); $("install").innerHTML = ""; toast("Okay. You can install it anytime from “Install app” in the footer.", "info"); },
  installhelp() {
    if (deferredPrompt) return ACT.install();
    if (standalone()) return toast("Green Budget is already installed on this device.", "info");
    openInfo("📲 Install Green Budget", INSTALL);
  },
  excel() { exportExcel(); },
  xlprev(b) { exportExcel(b.dataset.m); },
  backup() { backupAll(); },
  restore() { pickRestore(); },
  budget() {
    const inp = $("budgetIn"), v = parseAmount(inp.value);
    if (v === null) return bad(inp, "Please enter your monthly budget as a number, like 50000.");
    doc.budget = v;
    if (!save()) return;
    const t = totals();
    if (t.budget > 0 && t.planned > t.budget) toast("Budget saved. Your categories add up to " + money(t.planned) + ", which is " + money(t.planned - t.budget) + " more than your budget.", "info");
    else if (t.left < 0) toast("Budget saved, but you have already used " + money(-t.left) + " more than it.", "info");
    else toast("Budget saved 🌱 " + money(t.left) + " left to spend.", "success");
  },
  addcat() {
    const ni = $("cn"), ai = $("cb"), name = cleanName(ni.value);
    if (!name) return bad(ni, "Please give the category a name, like Groceries.");
    const amt = parseAmount(ai.value);
    if (amt === null) return bad(ai, "Please enter an amount for this category.");
    if (doc.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) return bad(ni, "You already have a category called “" + name + "”.");
    doc.categories.push({id: uid(), name: name, limit: amt, expenses: []});
    ni.value = ai.value = "";
    if (!save()) return;
    const t = totals();
    if (t.budget > 0 && t.planned > t.budget) {
      askRaiseBudget("Your categories now add up to " + money(t.planned) + ", more than your budget of " + money(t.budget) + ".", t.planned);
    } else if (t.budget <= 0) {
      toast("Category “" + name + "” added 🌱 Don't forget to set your monthly budget.", "success");
    } else toast("Category “" + name + "” added 🌱", "success");
  },
  addexp(b) { addExp(b.dataset.c); },
  bill(b) { addBill(b.dataset.c); },
  edit(b) { editCat(b.dataset.c); },
  editexp(b) { editExp(b.dataset.c, b.dataset.e); },
  togglepaid(b) { togglePaid(b.dataset.c, b.dataset.e); },
  delcat(b) { delCat(b.dataset.c); },
  delexp(b) { delExp(b.dataset.c, b.dataset.e); }
};
function run(name, el) {
  const fn = ACT[name];
  if (!fn) return;
  try { fn(el); } catch (err) { console.error(err); toast("That didn't work. Please try again, or refresh the page.", "error"); }
}
document.addEventListener("click", e => {
  const b = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!b) return;
  if (b.tagName === "A") e.preventDefault();
  run(b.dataset.act, b);
});
document.addEventListener("keydown", e => {
  const modalOn = $("modal").classList.contains("on");
  if (e.key === "Escape" && modalOn) { closeModal(); return; }
  if (e.key !== "Enter") return;
  const t = e.target;
  if (!t || t.tagName !== "INPUT" || t.type === "month" || t.type === "file") return;
  if (modalOn) { const ok = $("ok"); if (ok) { e.preventDefault(); ok.click(); } return; }
  const id = t.id;
  if (id === "budgetIn") run("budget");
  else if (id === "cn" || id === "cb") run("addcat");
  else if (id.indexOf("en-") === 0 || id.indexOf("ea-") === 0) addExp(id.slice(3));
});

/* ---------------- month picker ---------------- */
function thisMonth() { return today().slice(0, 7); }
$("month").addEventListener("change", () => {
  const v = $("month").value;
  if (!/^\d{4}-\d{2}$/.test(v)) {
    $("month").value = curMonth;
    return toast("Please pick a valid month.", "error");
  }
  curMonth = v;
  load();
});

/* ---------------- 3D effects (desktop tilt, light on phones) ---------------- */
function bindTilt() {
  if (!canTilt) return;
  document.querySelectorAll("[data-tilt]").forEach(el => {
    if (el._t) return; el._t = 1;
    el.addEventListener("mousemove", e => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.transform = "perspective(900px) rotateX(" + (-y * 7).toFixed(2) + "deg) rotateY(" + (x * 9).toFixed(2) + "deg)";
    });
    el.addEventListener("mouseleave", () => { el.style.transform = ""; });
  });
}
let rafBlob = 0;
function moveBlobs(x, y) {
  if (rafBlob) return;
  rafBlob = requestAnimationFrame(() => {
    rafBlob = 0;
    document.querySelectorAll(".blob").forEach(b => { const d = +b.dataset.d; b.style.transform = "translate3d(" + (x * d * 2) + "px," + (y * d * 2) + "px,0)"; });
  });
}
if (!reduceMotion) {
  document.addEventListener("mousemove", e => moveBlobs(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));
  window.addEventListener("deviceorientation", e => { if (e.gamma != null) moveBlobs(Math.max(-1, Math.min(1, e.gamma / 45)) * .5, Math.max(-1, Math.min(1, ((e.beta || 0) - 45) / 90)) * .5); });
}
(function leaves() {
  if (reduceMotion) return;
  const bg = $("bg"), set = ["🍃", "🌿", "🍀", "🌱", "🍂"];
  const n = window.matchMedia && matchMedia("(max-width:600px)").matches ? 5 : 8;
  for (let i = 0; i < n; i++) {
    const l = document.createElement("span");
    l.className = "leaf"; l.textContent = set[i % set.length];
    l.style.left = Math.random() * 92 + "vw";
    l.style.fontSize = 18 + Math.random() * 22 + "px";
    l.style.animationDuration = 12 + Math.random() * 14 + "s";
    l.style.animationDelay = -Math.random() * 20 + "s";
    bg.appendChild(l);
  }
})();

/* ---------------- offline + install ---------------- */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; $("install").innerHTML = ""; toast("Green Budget is installed 🌿 Open it from your home screen.", "success"); });
window.addEventListener("offline", () => toast("You are offline. Green Budget still works and saves on your phone.", "info"));
window.addEventListener("online", () => toast("Back online.", "success"));
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.onmessage = e => { if (e.data && e.data.type === "updated") showUpdate(); };
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(err => console.warn("Offline mode unavailable:", err));
    navigator.serviceWorker.ready.then(() => {
      if (!lsGet("gb-offline-ready")) { lsSet("gb-offline-ready", "1"); toast("Ready to work offline ✓", "success"); }
    }).catch(() => {});
  });
}

/* ---------------- start ---------------- */
curMonth = thisMonth();
$("month").value = curMonth;
notices();
if (standalone()) $("fInstall").hidden = true;
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
try { load(); dueReminder(); } catch (err) { console.error(err); toast("Couldn't load your saved data. Please refresh the page.", "error"); }
setTimeout(() => document.body.classList.remove("intro"), 1200);
// warm up the Excel library quietly (never blocks the page; skipped on data saver)
window.addEventListener("load", () => setTimeout(() => {
  if (navigator.connection && navigator.connection.saveData) return;
  loadXlsx().catch(() => {});
}, 2500));
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found – Green Budget</title>
<meta name="description" content="This page could not be found. Head back to Green Budget to plan your monthly budget and track your spending.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f3d2e">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥀%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;max-width:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#10321f;line-height:1.45;
  min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-wrap:break-word;
  background:#1f6f4a linear-gradient(160deg,#0f3d2e,#1f6f4a 55%,#8fd18a);background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
@supports (overflow:clip){html,body{overflow-x:clip}}
:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
.card{
  width:100%;max-width:460px;text-align:center;padding:28px 20px 24px;border-radius:24px;
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 1px 0 #fff inset,0 10px 0 -5px rgba(27,107,61,.35),0 22px 40px rgba(0,0,0,.3);
  perspective:700px;
}
.plant{font-size:clamp(64px,22vw,96px);line-height:1;display:inline-block;animation:droop 4s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
@keyframes droop{0%,100%{transform:rotateZ(-6deg) rotateY(-18deg)}50%{transform:rotateZ(6deg) rotateY(18deg)}}
.code{margin:6px 0 0;font-size:clamp(44px,16vw,72px);font-weight:900;line-height:1;color:#17703c;
  text-shadow:0 2px 0 #0f4a28,0 4px 0 #0f4a28,0 10px 14px rgba(0,0,0,.3)}
h1{margin:10px 0 6px;font-size:clamp(20px,6vw,26px)}
p{margin:6px 0;color:#3f5f4a}
.path{display:none;margin:12px 0 0;padding:8px 10px;border-radius:10px;background:#eef7e9;font-size:13px;color:#3f5f4a}
.path code{overflow-wrap:anywhere;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{
  flex:1 1 150px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:0;border-radius:14px;
  padding:12px 16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;background:linear-gradient(180deg,#1f8f50,#17703c);box-shadow:0 5px 0 #0f4a28,0 10px 16px rgba(0,0,0,.25);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0f4a28}
.btn.sec{background:linear-gradient(180deg,#fff,#e2f3dc);color:#12552f;box-shadow:0 5px 0 #a9cfa1,0 10px 16px rgba(0,0,0,.18)}
.btn.sec:active{box-shadow:0 1px 0 #a9cfa1}
.btn[hidden]{display:none}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
@media(max-width:360px){.card{padding:22px 14px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="plant" aria-hidden="true">🥀</div>
  <p class="code" aria-hidden="true">404</p>
  <h1>This page has wilted</h1>
  <p>We couldn't find the page you were looking for. It may have been moved, or the link may have a typo.</p>
  <p class="path" id="pathbox">You asked for: <code id="path"></code></p>
  <div class="actions">
    <a class="btn" href="/">🌿 Go to my budget</a>
    <button type="button" class="btn sec" id="back" hidden>← Go back</button>
  </div>
</main>
<script>
(function () {
  try {
    var p = location.pathname + location.search;
    if (p && p !== "/") {
      document.getElementById("path").textContent = p.length > 120 ? p.slice(0, 117) + "…" : p;
      document.getElementById("pathbox").style.display = "block";
    }
    var back = document.getElementById("back");
    if (history.length > 1 && document.referrer) {
      back.hidden = false;
      back.addEventListener("click", function () { history.back(); });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
